<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism.css" rel="stylesheet">
</head>
<body>
    <div id="pinContainer" >
        <h2>Introduce tu Nombre y espera a tu teacher</h2>
        <input type="text" id="nameInput" placeholder="Ingrese su nombre">
        <input type="password" id="pinInput" placeholder="Ingrese PIN">
        <button onclick="checkCredentials()">Ingresar</button>
        <p id="pinError" class="error-message">PIN incorrecto o falta de nombre. Intenta de nuevo.</p>
    </div>

    <div id="examContent" >
        <h1>Actividad recreativa</h1>
<!--#################################################################################################-->



 <iframe id="myIframe" src="instuctions.html" width="100%" height="1500px"></iframe>


<!--#################################################################################################-->
        <p id="timer">Tiempo restante: <span id="time">7200</span> segundos</p>
        <p id="warning"></p>

        <button onclick="refreshIframe()">Refrescar Compilador</button>
        <p>Al refrescar se borra el contenido del compilador.</p>

        <!-- Iframe para cargar el compilador -->
        <iframe id="myIframe" src="https://onecompiler.com/python" width="100%" height="600"></iframe>

        <!-- Formulario para pegar el código -->
        <form id="examForm">
            <label for="code">Pega aquí tu código editado:</label>
            <textarea id="code" name="code" rows="10" cols="50"></textarea>
            <button type="button" onclick="submitExam()">Enviar Examen</button>
        </form>
    
        <iframe id="myIframe" src="documentation.html" width="100%" height="1500px"></iframe>

    <footer>
        <p>¡Explora más sobre Python y sigue aprendiendo!</p>
    </footer>
</div>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-python.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.21/jspdf.plugin.autotable.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
